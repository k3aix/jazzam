name: CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

jobs:
  jazz-frontend:
    uses: k3aix/aac-k3s/.github/workflows/docker-multiarch-build.yml@main
    with:
      service: jazz-frontend
      context: frontend
      build_args: VITE_APP_VERSION=${{ github.sha }}

  jazz-standards:
    uses: k3aix/aac-k3s/.github/workflows/docker-multiarch-build.yml@main
    with:
      service: jazz-standards
      context: backend/standards-service

  jazz-search:
    uses: k3aix/aac-k3s/.github/workflows/docker-multiarch-build.yml@main
    with:
      service: jazz-search
      context: backend/search-service/SearchService

  deploy-staging:
    name: Deploy to staging
    runs-on: k3aix-amd64-runners
    needs: [jazz-frontend, jazz-standards, jazz-search]
    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mkdir -p "$HOME/.local/bin"
          mv kubectl "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rollout restart
        env:
          K8S_TOKEN: ${{ secrets.K8S_STAGING_DEPLOYER_TOKEN }}
        run: |
          kubectl \
            --server=https://kubernetes.default.svc \
            --token="$K8S_TOKEN" \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            rollout restart deployment/jazz-frontend deployment/jazz-standards deployment/jazz-search -n jazzam-staging
